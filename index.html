<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e8">
  <title>Starfall</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f2e8;
      --ink: #18251e;
      --muted: #647067;
      --green: #c7f36b;
      --coral: #ff745c;
      --line: #d8d8c9;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#c9cbbd 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    button { font: inherit; }

    .shell {
      width: min(100% - 32px, 940px);
      margin: 0 auto;
      padding: 28px 0 30px;
      animation: arrive 500ms ease-out both;
    }

    .topbar, .brand, .readout, .readout-item, .bottomline {
      display: flex;
      align-items: center;
    }

    .topbar { justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .brand { gap: 11px; }

    .mark {
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      color: var(--ink);
      background: var(--green);
      border: 2px solid var(--ink);
      border-radius: 12px 12px 12px 4px;
      font-size: 20px;
      transform: rotate(-5deg);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 900;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .readout { gap: 22px; }
    .readout-item { gap: 8px; }
    .readout-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .readout-value { min-width: 38px; font: 800 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .life-dots { display: flex; gap: 4px; }
    .life-dot { width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; background: var(--coral); }
    .life-dot.lost { background: transparent; opacity: 0.35; }

    .frame {
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: #12271f;
      box-shadow: 7px 7px 0 var(--ink);
    }

    .playfield { position: relative; width: 100%; aspect-ratio: 8 / 5; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(10 28 21 / 35%);
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .dialog { max-width: 360px; color: #f5f2e8; }

    .dialog-kicker {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .dialog h2 {
      margin: 0;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 0.95;
      font-weight: 900;
      text-transform: uppercase;
    }

    .dialog-copy { margin: 13px 0 19px; color: #d1d8ce; font-size: 14px; line-height: 1.5; }

    .action {
      min-height: 46px;
      padding: 0 20px;
      color: var(--ink);
      background: var(--green);
      border: 2px solid var(--green);
      border-radius: 5px;
      box-shadow: 3px 3px 0 var(--coral);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .action:hover { background: #d7ff8d; transform: translate(-1px, -1px); }
    .action:focus-visible, .pad-button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .bottomline { justify-content: space-between; gap: 16px; margin: 17px 0 0; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .hint strong { color: var(--ink); }

    .touch-pad {
      display: none;
      grid-template: repeat(2, 42px) / repeat(3, 42px);
      gap: 5px;
      touch-action: none;
    }

    .pad-button {
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--ink);
      background: #fffdf6;
      border: 1px solid var(--line);
      border-radius: 5px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .pad-button:active { background: var(--green); }
    [data-key="ArrowUp"] { grid-area: 1 / 2; }
    [data-key="ArrowLeft"] { grid-area: 2 / 1; }
    [data-key="ArrowDown"] { grid-area: 2 / 2; }
    [data-key="ArrowRight"] { grid-area: 2 / 3; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 940px); padding-top: 19px; }
      .topbar { align-items: flex-start; }
      .readout { gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
      .readout-item { gap: 5px; flex-direction: column; align-items: flex-start; }
      .readout-label { font-size: 9px; }
      .readout-value { font-size: 14px; }
      .bottomline { align-items: flex-start; }
      .hint { max-width: 180px; padding-top: 4px; line-height: 1.5; }
      .touch-pad { display: grid; }
      .frame { box-shadow: 4px 4px 0 var(--ink); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">✦</div>
        <div>
          <h1>Starfall</h1>
          <p class="eyebrow">A tiny survival game</p>
        </div>
      </div>
      <div class="readout" aria-label="Game stats">
        <div class="readout-item"><span class="readout-label">Score</span><span class="readout-value" id="score">0000</span></div>
        <div class="readout-item"><span class="readout-label">Best</span><span class="readout-value" id="best">0000</span></div>
        <div class="readout-item"><span class="readout-label">Time</span><span class="readout-value" id="time">45</span></div>
        <div class="readout-item"><span class="readout-label">Lives</span><span class="life-dots" id="lives" aria-label="3 lives"></span></div>
      </div>
    </header>

    <section class="frame" aria-label="Starfall game">
      <div class="playfield">
        <canvas id="game" width="960" height="600" aria-label="Game field: steer the green ship, collect gold stars, and dodge coral meteors."></canvas>
        <div class="overlay" id="overlay">
          <div class="dialog">
            <p class="dialog-kicker" id="kicker">Ready, pilot?</p>
            <h2 id="message">Find your<br>way home.</h2>
            <p class="dialog-copy" id="copy">Catch the stars. Dodge the meteors. You have three lives and 45 seconds.</p>
            <button class="action" id="start">Launch mission</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottomline">
      <p class="hint"><strong>Move:</strong> arrow keys or WASD<br><strong>Goal:</strong> collect stars, dodge meteors</p>
      <div class="touch-pad" aria-label="Touch movement controls">
        <button class="pad-button" data-key="ArrowUp" aria-label="Move up">↑</button>
        <button class="pad-button" data-key="ArrowLeft" aria-label="Move left">←</button>
        <button class="pad-button" data-key="ArrowDown" aria-label="Move down">↓</button>
        <button class="pad-button" data-key="ArrowRight" aria-label="Move right">→</button>
      </div>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const overlay = document.querySelector("#overlay");
    const scoreLabel = document.querySelector("#score");
    const bestLabel = document.querySelector("#best");
    const timeLabel = document.querySelector("#time");
    const livesLabel = document.querySelector("#lives");
    const startButton = document.querySelector("#start");
    const keys = new Set();
    const width = canvas.width;
    const height = canvas.height;
    const bestKey = "starfall-best";
    const backgroundStars = Array.from({ length: 76 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.55 + 0.15
    }));
    const game = {
      mode: "ready",
      player: { x: width / 2, y: height - 86, radius: 17, speed: 350 },
      meteors: [],
      stars: [],
      elapsed: 0,
      spawnMeteor: 0,
      spawnStar: 0,
      invulnerable: 0,
      lives: 3,
      collected: 0,
      score: 0,
      best: Number(localStorage.getItem(bestKey)) || 0,
      lastTime: 0
    };

    bestLabel.textContent = String(game.best).padStart(4, "0");

    function setLives() {
      livesLabel.replaceChildren();
      for (let index = 0; index < 3; index += 1) {
        const dot = document.createElement("span");
        dot.className = `life-dot${index >= game.lives ? " lost" : ""}`;
        dot.setAttribute("aria-hidden", "true");
        livesLabel.append(dot);
      }
      livesLabel.setAttribute("aria-label", `${game.lives} ${game.lives === 1 ? "life" : "lives"}`);
    }

    function startGame() {
      game.mode = "playing";
      game.player.x = width / 2;
      game.player.y = height - 86;
      game.meteors = [];
      game.stars = [];
      game.elapsed = 0;
      game.spawnMeteor = 0.3;
      game.spawnStar = 1;
      game.invulnerable = 0;
      game.lives = 3;
      game.collected = 0;
      game.score = 0;
      game.lastTime = performance.now();
      scoreLabel.textContent = "0000";
      timeLabel.textContent = "45";
      setLives();
      overlay.hidden = true;
    }

    function finishGame(won) {
      game.mode = "over";
      game.score = Math.floor(game.elapsed * 10) + game.collected * 100;
      scoreLabel.textContent = String(game.score).padStart(4, "0");
      if (game.score > game.best) {
        game.best = game.score;
        localStorage.setItem(bestKey, String(game.best));
        bestLabel.textContent = String(game.best).padStart(4, "0");
      }
      document.querySelector("#kicker").textContent = won ? "Mission complete" : "Ship down";
      document.querySelector("#message").innerHTML = won ? "Well<br>played." : "One more<br>run?";
      document.querySelector("#copy").textContent = `You scored ${game.score} points and collected ${game.collected} ${game.collected === 1 ? "star" : "stars"}.`;
      startButton.textContent = "Play again";
      overlay.hidden = false;
      keys.clear();
    }

    function addMeteor() {
      const radius = 13 + Math.random() * 17;
      game.meteors.push({
        x: radius + Math.random() * (width - radius * 2),
        y: -radius,
        radius,
        speed: 170 + Math.random() * 120 + game.elapsed * 3,
        drift: (Math.random() - 0.5) * 65,
        spin: Math.random() * Math.PI * 2
      });
    }

    function addStar() {
      game.stars.push({ x: 24 + Math.random() * (width - 48), y: -15, radius: 11, speed: 150 + Math.random() * 55, phase: Math.random() * 6 });
    }

    function overlaps(first, second, padding = 0) {
      return Math.hypot(first.x - second.x, first.y - second.y) < first.radius + second.radius + padding;
    }

    function update(delta) {
      if (game.mode !== "playing") return;
      game.elapsed += delta;
      game.invulnerable = Math.max(0, game.invulnerable - delta);
      const directionX = Number(keys.has("ArrowRight") || keys.has("d") || keys.has("D")) - Number(keys.has("ArrowLeft") || keys.has("a") || keys.has("A"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s") || keys.has("S")) - Number(keys.has("ArrowUp") || keys.has("w") || keys.has("W"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      game.player.x = Math.max(22, Math.min(width - 22, game.player.x + directionX / magnitude * game.player.speed * delta));
      game.player.y = Math.max(28, Math.min(height - 24, game.player.y + directionY / magnitude * game.player.speed * delta));

      game.spawnMeteor -= delta;
      game.spawnStar -= delta;
      if (game.spawnMeteor <= 0) {
        addMeteor();
        game.spawnMeteor = Math.max(0.28, 0.78 - game.elapsed * 0.006) * (0.75 + Math.random() * 0.5);
      }
      if (game.spawnStar <= 0) {
        addStar();
        game.spawnStar = 2.2 + Math.random() * 1.1;
      }

      for (let index = game.meteors.length - 1; index >= 0; index -= 1) {
        const meteor = game.meteors[index];
        meteor.y += meteor.speed * delta;
        meteor.x += meteor.drift * delta;
        meteor.spin += delta;
        if (meteor.y > height + meteor.radius) game.meteors.splice(index, 1);
        else if (game.invulnerable === 0 && overlaps(game.player, meteor, -3)) {
          game.meteors.splice(index, 1);
          game.lives -= 1;
          game.invulnerable = 1.1;
          setLives();
          if (game.lives <= 0) finishGame(false);
        }
      }

      for (let index = game.stars.length - 1; index >= 0; index -= 1) {
        const star = game.stars[index];
        star.y += star.speed * delta;
        star.phase += delta * 5;
        if (star.y > height + 20) game.stars.splice(index, 1);
        else if (overlaps(game.player, star, 4)) {
          game.stars.splice(index, 1);
          game.collected += 1;
        }
      }

      const remaining = Math.max(0, 45 - Math.floor(game.elapsed));
      timeLabel.textContent = String(remaining).padStart(2, "0");
      game.score = Math.floor(game.elapsed * 10) + game.collected * 100;
      scoreLabel.textContent = String(game.score).padStart(4, "0");
      if (remaining === 0 && game.mode === "playing") finishGame(true);
    }

    function drawShip() {
      const { x, y } = game.player;
      if (game.invulnerable > 0 && Math.floor(game.invulnerable * 12) % 2 === 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#c7f36b";
      ctx.strokeStyle = "#12271f";
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(17, 17);
      ctx.lineTo(0, 11);
      ctx.lineTo(-17, 17);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ff745c";
      ctx.beginPath();
      ctx.moveTo(-6, 17);
      ctx.lineTo(0, 27 + Math.random() * 8);
      ctx.lineTo(6, 17);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMeteor(meteor) {
      ctx.save();
      ctx.translate(meteor.x, meteor.y);
      ctx.rotate(meteor.spin);
      ctx.fillStyle = "#ff745c";
      ctx.strokeStyle = "#ffd08a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let point = 0; point < 9; point += 1) {
        const angle = point * Math.PI * 2 / 9;
        const radius = meteor.radius * (point % 2 ? 0.83 : 1 + Math.sin(point * 7) * 0.08);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (point === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgb(111 43 34 / 38%)";
      ctx.beginPath();
      ctx.arc(-meteor.radius * 0.2, meteor.radius * 0.13, meteor.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStar(star) {
      ctx.save();
      ctx.translate(star.x, star.y);
      ctx.rotate(star.phase * 0.12);
      ctx.fillStyle = "#ffd166";
      ctx.strokeStyle = "#fff0ba";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let point = 0; point < 10; point += 1) {
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const radius = point % 2 ? star.radius * 0.43 : star.radius;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (point === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#203b30");
      sky.addColorStop(1, "#10251e");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "rgb(198 243 107 / 8%)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x += 48) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y <= height; y += 48) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }
      for (const star of backgroundStars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#e9f0d7";
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;
      for (const star of game.stars) drawStar(star);
      for (const meteor of game.meteors) drawMeteor(meteor);
      if (game.mode !== "over") drawShip();
    }

    function frame(now) {
      const delta = Math.min((now - game.lastTime) / 1000, 0.04);
      game.lastTime = now;
      update(delta);
      draw();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
      if (event.key === "Enter" && game.mode !== "playing") startGame();
      keys.add(event.key);
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key));
    window.addEventListener("blur", () => keys.clear());
    document.querySelectorAll(".pad-button").forEach((button) => {
      const key = button.dataset.key;
      button.addEventListener("pointerdown", (event) => { event.preventDefault(); keys.add(key); button.setPointerCapture(event.pointerId); });
      button.addEventListener("pointerup", () => keys.delete(key));
      button.addEventListener("pointercancel", () => keys.delete(key));
      button.addEventListener("lostpointercapture", () => keys.delete(key));
    });
    startButton.addEventListener("click", startGame);
    setLives();
    draw();
    game.lastTime = performance.now();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
